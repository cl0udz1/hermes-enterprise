name: MVP slice
description: Track one implementation slice for the enterprise fork.
title: "[MVP Slice]: "
labels:
  - enterprise-mvp1
body:
  - type: input
    id: phase
    attributes:
      label: Phase
      placeholder: MVP-1
    validations:
      required: true
  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables
      description: What files, modules, or workflows should this slice add?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true before merge?
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Which gate, tests, or doctor checks must pass?
      value: |
        python scripts/enterprise_mvp0_gate.py
    validations:
      required: true
  - type: checkboxes
    id: guardrails
    attributes:
      label: Guardrails
      options:
        - label: Keep changes narrowly scoped to this slice.
          required: true
        - label: Preserve upstream Hermes shape where possible.
          required: true
        - label: Update docs and tests in the same PR.
          required: true
